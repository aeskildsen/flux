version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # pnpm projects use the npm ecosystem. Dependabot reads pnpm-lock.yaml.
  # Dependabot does not update flux-engine, because it is a release tarball URL.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # A Playwright update must also change the Playwright image tag in
      # .github/workflows/deploy.yml (scripts/toolchain.test.ts checks this).
      # This group keeps the update in a separate pull request. This group
      # comes first, because Dependabot uses the first group that matches.
      playwright:
        patterns:
          - playwright
          - "@playwright/test"
      minor-and-patch:
        update-types:
          - minor
          - patch
