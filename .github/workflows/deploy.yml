name: Deploy to GitHub Pages

on:
  push:
    branches: [main, feature/*]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One group for each branch: a new push cancels the older run on the same
# branch only. A push to a feature branch does not cancel a deploy from main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The image tag must equal the installed Playwright version. scripts/toolchain.test.ts
  # checks this, and scripts/test-container.sh reads the tag from this line.
  test:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Lint, type-check, server tests with coverage, browser tests.
      - name: Test
        run: scripts/ci-test.sh

  # The runner release is pinned, because the SynthDefs are compiled with the
  # sclang from its apt archive. A new release can change the sclang version.
  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup sclang
        env:
          QT_QPA_PLATFORM: offscreen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends supercollider-language && sclang scripts/install_sclang_dependencies.scd

      - name: Install dependencies
        run: pnpm install
        
      # With the class files of the flux-engine package on the class path
      # (scripts/engine.ts), so that synthdefs/woodbar.scd compiles.
      - name: Compile SynthDefs
        env:
          QT_QPA_PLATFORM: offscreen
        run: pnpm build:synthdefs
        
      - name: Build SvelteKit app
        env:
          BASE_PATH: /flux
        run: pnpm build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
